name: Update SPX gamma levels

on:
  workflow_dispatch:
  schedule:
    # 12:00 UTC = 13:00 en España (invierno) / 14:00 (verano).
    # En ambos casos cae antes de la apertura de Nueva York.
    - cron: "0 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Calculate gamma levels
        run: python scripts/update_gex.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gex_levels.json data/gex_history.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update SPX gamma levels"
          git pull --rebase
          git push
